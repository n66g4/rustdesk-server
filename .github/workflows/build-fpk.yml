name: Build fnOS FPK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build hbbs/hbbr (static musl)
        run: |
          cargo build --release --target x86_64-unknown-linux-musl --bin hbbs --bin hbbr

      - name: Install fnpack
        run: |
          curl -fsSL -o fnpack https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64
          chmod +x fnpack
          sudo mv fnpack /usr/local/bin/fnpack

      - name: Assemble FPK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/assemble-fpk.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-server-fpk
          path: dist/*.fpk

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.fpk
