<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RustDesk Server 设置</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #e8f4fc;
      color: #333;
      padding: 16px 24px 32px;
      font-size: 14px;
    }
    h1 { font-size: 18px; text-align: center; margin: 8px 0 16px; color: #1a5f8a; }
    .box {
      background: rgba(255,255,255,0.65);
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 8px;
      padding: 16px 18px 8px;
      margin-bottom: 14px;
      position: relative;
    }
    .box::before {
      content: attr(data-title);
      position: absolute;
      left: 50%;
      top: 0;
      transform: translate(-50%, -50%);
      background: #d6ebf7;
      padding: 0 10px;
      font-size: 12px;
      color: #696969;
      font-weight: 600;
      white-space: nowrap;
    }
    .row { display: flex; gap: 12px; flex-wrap: wrap; }
    .field { flex: 1 1 180px; margin-bottom: 12px; }
    .field label { display: block; color: #696969; font-size: 12px; margin-bottom: 4px; }
    .field input, .field select {
      width: 100%;
      height: 34px;
      padding: 0 10px;
      border: 1px solid #c5d8e6;
      border-radius: 5px;
      background: #fff;
    }
    .field input[readonly] { background: #f0f0f0; color: #6c757d; }
    .check-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      color: #696969;
      font-size: 13px;
    }
    .check-row input { width: auto; height: auto; }
    .key-wrap { position: relative; }
    .key-wrap input { padding-right: 40px; }
    .key-wrap .eye {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: none;
      cursor: pointer;
      font-size: 14px;
      color: #666;
      padding: 4px;
    }
    .hint { font-size: 11px; color: #888; margin-top: 2px; }
    .actions { text-align: center; margin-top: 18px; }
    .btn {
      display: inline-block;
      min-width: 160px;
      height: 40px;
      line-height: 40px;
      margin: 0 8px 8px;
      border: none;
      border-radius: 6px;
      background: #1e90ff;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      padding: 0 18px;
    }
    .btn:hover { background: #00b5e5; }
    .btn.secondary { background: #3cb371; }
    .btn.secondary:hover { background: #2e9a5e; }
    .btn:disabled { opacity: 0.6; cursor: wait; }
    #msg {
      text-align: center;
      margin-top: 10px;
      min-height: 1.2em;
      color: #1a5f8a;
    }
    #msg.err { color: #c0392b; }
  </style>
</head>
<body>
  <h1>RustDesk Server 设置</h1>

  <div class="box" data-title="服务地址">
    <div class="row">
      <div class="field">
        <label for="host">域名或 IP</label>
        <input id="host" type="text" placeholder="默认端口时可留空，否则请填写有效域名或 IP">
        <div class="hint">不要带端口。非默认 hbbs/hbbr 端口时必填。管理后台不走此域名。</div>
      </div>
      <div class="field">
        <label for="api_scheme">API 协议（客户端）</label>
        <select id="api_scheme">
          <option value="http">http</option>
          <option value="https">https</option>
        </select>
        <div class="hint">写入客户端 api-server；本机 API 仍是 http。</div>
      </div>
      <div class="field">
        <label for="api_port">API / 管理后台端口</label>
        <input id="api_port" type="number" readonly>
        <div class="hint">自动 = hbbs − 2（与群晖一致）</div>
      </div>
    </div>
  </div>

  <div class="box" data-title="端口">
    <div class="row">
      <div class="field">
        <label for="hbbs_port">ID / 打洞端口 (hbbs)</label>
        <input id="hbbs_port" type="number" min="2" max="65535">
        <div class="hint">需开放 TCP+UDP</div>
      </div>
      <div class="field">
        <label for="hbbs_nat_port">NAT 测试端口</label>
        <input id="hbbs_nat_port" type="number" readonly>
        <div class="hint">自动 = hbbs − 1</div>
      </div>
      <div class="field">
        <label for="hbbs_web_port">hbbs WebSocket</label>
        <input id="hbbs_web_port" type="number" readonly>
        <div class="hint">自动 = hbbs + 2</div>
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label for="hbbr_port">中继端口 (hbbr)</label>
        <input id="hbbr_port" type="number" min="1" max="65535">
      </div>
      <div class="field">
        <label for="hbbr_web_port">hbbr WebSocket</label>
        <input id="hbbr_web_port" type="number" readonly>
        <div class="hint">自动 = hbbr + 2</div>
      </div>
      <div class="field">
        <label for="must_login">强制登录 (MUST_LOGIN)</label>
        <select id="must_login">
          <option value="N">关闭</option>
          <option value="Y">开启</option>
        </select>
      </div>
    </div>
  </div>

  <div class="box" data-title="KEY">
    <label class="check-row" for="use_custom_key">
      <input id="use_custom_key" type="checkbox">
      <span>使用自定义 KEY</span>
    </label>
    <div class="field">
      <label for="key">Key（客户端加密）</label>
      <div class="key-wrap">
        <input id="key" type="password" placeholder="自动生成的公钥" readonly>
        <button type="button" class="eye" id="btnKeyEye" title="显示/隐藏">显示</button>
      </div>
      <div class="hint" id="key_hint">未勾选时使用本机自动生成的公钥（只读）。勾选后可粘贴自定义 KEY。</div>
    </div>
  </div>

  <div class="actions">
    <button type="button" class="btn" id="btnSave">保存设置</button>
    <button type="button" class="btn secondary" id="btnAdmin">管理后台</button>
  </div>
  <div id="msg"></div>

  <script>
    const API = "/cgi/ThirdParty/rustdesk-server/api.cgi";
    let publicKey = "";
    let customKey = "";

    function $(id) { return document.getElementById(id); }

    function syncDerived() {
      const hbbs = parseInt($("hbbs_port").value, 10);
      const hbbr = parseInt($("hbbr_port").value, 10);
      if (!isNaN(hbbs)) {
        $("hbbs_nat_port").value = hbbs - 1;
        $("hbbs_web_port").value = hbbs + 2;
        $("api_port").value = hbbs - 2;
      }
      if (!isNaN(hbbr)) {
        $("hbbr_web_port").value = hbbr + 2;
      }
    }

    // Domain / IPv4 / IPv6 (aligned with Synology SPK). Empty OK only with default ports.
    function isValidHost(host) {
      if (!host) return true;
      if (/^[^[\]]+:\d+$/.test(host)) return false; // host:port
      const domain = /^([a-zA-Z0-9\-_]+\.)+[a-zA-Z]{2,}$/;
      const ipv4 = /^((25[0-5]|2[0-4]\d|[01]?\d\d?)\.){3}(25[0-5]|2[0-4]\d|[01]?\d\d?)$/;
      const ipv6 = /^([a-fA-F0-9:]+:+)+[a-fA-F0-9]+$/;
      return domain.test(host) || ipv4.test(host) || ipv6.test(host);
    }

    function syncKeyField() {
      const custom = $("use_custom_key").checked;
      const input = $("key");
      if (custom) {
        input.readOnly = false;
        input.placeholder = "粘贴自定义 KEY";
        input.value = customKey || "";
        $("key_hint").textContent = "勾选后可填写自定义 KEY，将写入客户端配置。";
      } else {
        if (!input.readOnly) customKey = input.value.trim();
        input.readOnly = true;
        input.placeholder = "自动生成的公钥";
        input.value = publicKey || "";
        $("key_hint").textContent = "未勾选时使用本机自动生成的公钥（只读）。勾选后可粘贴自定义 KEY。";
      }
    }

    function adminUrl() {
      const host = window.location.hostname;
      const port = $("api_port").value || "21114";
      return "http://" + host + ":" + port + "/_admin/";
    }

    function setMsg(text, err) {
      const el = $("msg");
      el.textContent = text || "";
      el.className = err ? "err" : "";
    }

    function validate() {
      syncDerived();
      const host = $("host").value.trim();
      if (/^[^[\]]+:\d+$/.test(host)) {
        setMsg("域名或 IP 不能包含端口号", true);
        return false;
      }
      if (host && !isValidHost(host)) {
        setMsg("请输入有效的域名或 IP 地址", true);
        return false;
      }
      const hbbs = String($("hbbs_port").value);
      const hbbr = String($("hbbr_port").value);
      if ((hbbs !== "21116" || hbbr !== "21117") && !host) {
        setMsg("使用非默认端口时必须填写域名或 IP", true);
        return false;
      }
      const ports = [
        $("api_port").value,
        $("hbbs_port").value,
        $("hbbr_port").value,
        $("hbbs_nat_port").value,
        $("hbbs_web_port").value,
        $("hbbr_web_port").value
      ].map(Number);
      for (const p of ports) {
        if (!p || p < 1 || p > 65535) {
          setMsg("端口无效（API 端口 = hbbs − 2，请检查 hbbs）", true);
          return false;
        }
      }
      if (new Set(ports).size !== ports.length) {
        setMsg("端口不能重复", true);
        return false;
      }
      if ($("use_custom_key").checked && !$("key").value.trim()) {
        setMsg("已勾选自定义 KEY，请填写 Key", true);
        return false;
      }
      return true;
    }

    async function loadConfig() {
      setMsg("加载中…");
      try {
        const res = await fetch(API + "?action=get", { credentials: "same-origin" });
        const data = await res.json();
        if (!data.success) throw new Error(data.message || "加载失败");
        $("host").value = data.host || "";
        $("api_scheme").value = data.api_scheme || "http";
        $("hbbs_port").value = data.hbbs_port || "21116";
        $("hbbr_port").value = data.hbbr_port || "21117";
        $("must_login").value = data.must_login || "N";
        publicKey = data.public_key || "";
        customKey = data.use_custom_key === "Y" ? (data.key || "") : "";
        $("use_custom_key").checked = data.use_custom_key === "Y";
        syncKeyField();
        syncDerived(); // sets api_port = hbbs - 2
        setMsg("");
      } catch (e) {
        setMsg(String(e.message || e), true);
      }
    }

    async function saveConfig() {
      if (!validate()) return;
      $("btnSave").disabled = true;
      setMsg("保存并重启服务…");
      try {
        const custom = $("use_custom_key").checked;
        if (custom) customKey = $("key").value.trim();
        const body = new URLSearchParams({
          action: "save",
          host: $("host").value.trim(),
          api_scheme: $("api_scheme").value,
          api_port: $("api_port").value,
          hbbs_port: $("hbbs_port").value,
          hbbr_port: $("hbbr_port").value,
          use_custom_key: custom ? "Y" : "N",
          key: custom ? customKey : "",
          must_login: $("must_login").value
        });
        const res = await fetch(API, {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: body.toString()
        });
        const data = await res.json();
        if (!data.success) throw new Error(data.message || "保存失败");
        if (data.public_key) publicKey = data.public_key;
        if (data.use_custom_key === "Y") {
          customKey = data.key || customKey;
          $("use_custom_key").checked = true;
        } else {
          customKey = "";
          $("use_custom_key").checked = false;
        }
        syncKeyField();
        setMsg(data.message || "已保存");
      } catch (e) {
        setMsg(String(e.message || e), true);
      } finally {
        $("btnSave").disabled = false;
      }
    }

    $("hbbs_port").addEventListener("input", syncDerived);
    $("hbbr_port").addEventListener("input", syncDerived);
    $("use_custom_key").addEventListener("change", syncKeyField);
    $("btnKeyEye").addEventListener("click", function () {
      const input = $("key");
      const show = input.type === "password";
      input.type = show ? "text" : "password";
      $("btnKeyEye").textContent = show ? "隐藏" : "显示";
    });
    $("btnSave").addEventListener("click", saveConfig);
    $("btnAdmin").addEventListener("click", function () {
      window.open(adminUrl(), "_blank");
    });

    loadConfig();
  </script>
</body>
</html>
