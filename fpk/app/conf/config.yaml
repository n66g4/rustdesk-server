lang: "zh-CN"
app:
  web-client: 1
  register: false
  register-status: 1
  captcha-threshold: 3
  ban-threshold: 0
  show-swagger: 0
  token-expire: 168h
  web-sso: true
  disable-pwd-login: false
admin:
  title: "RustDesk API Admin"
  hello-file: "./conf/admin/hello.html"
  hello: ""
  id-server-port: 21116
  relay-server-port: 21117
gin:
  api-addr: "0.0.0.0:21114"
  mode: "release"
  resources-path: "resources"
  trust-proxy: ""
gorm:
  type: "sqlite"
  max-idle-conns: 10
  max-open-conns: 100
mysql:
  username: ""
  password: ""
  addr: ""
  dbname: ""
  tls: "false"
postgresql:
  host: "127.0.0.1"
  port: "5432"
  user: ""
  password: ""
  dbname: "postgres"
  sslmode: "disable"
  time-zone: "Asia/Shanghai"
rustdesk:
  id-server: "127.0.0.1:21116"
  relay-server: "127.0.0.1:21117"
  api-server: "http://127.0.0.1:21114"
  key: ""
  key-file: "./data/id_ed25519.pub"
  personal: 1
  webclient-magic-queryonline: 0
  ws-host: ""
logger:
  path: "./logs/api.log"
  level: "info"
  report-caller: true
proxy:
  enable: false
  host: "http://127.0.0.1:1080"
jwt:
  key: ""
  expire-duration: 168h
ldap:
  enable: false
  url: "ldap://ldap.example.com:389"
  tls-ca-file: ""
  tls-verify: false
  base-dn: "dc=example,dc=com"
  bind-dn: "cn=admin,dc=example,dc=com"
  bind-password: "password"
  user:
    base-dn: "ou=users,dc=example,dc=com"
    enable-attr: ""
    enable-attr-value: ""
    filter: "(cn=*)"
    username: "uid"
    email: "mail"
    first-name: "givenName"
    last-name: "sn"
    sync: false
    admin-group: "cn=admin,dc=example,dc=com"
    allow-group: "cn=users,dc=example,dc=com"
